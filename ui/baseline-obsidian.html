<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>黑曜精工 · Obsidian Minimalist (严格保持原结构)</title>
  <style>
    :root {
      --bg-desktop: #06080C;
      --bg-window: #0D1117;
      --bg-subtle: #161B22;
      --bg-input: #090D13;
      --border-card: #21262D;
      --border-active: #388BFD;
      --accent-blue: #58A6FF;
      --accent-green: #238636;
      --accent-green-hover: #2EA043;
      --text-primary: #F0F6FC;
      --text-secondary: #8B949E;
      --text-muted: #586069;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Inter", sans-serif;
      --font-mono: "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-desktop);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 820px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Fixed 620x720 Desktop Window */
    .app-window {
      width: 620px;
      height: 720px;
      background-color: var(--bg-window);
      border-radius: 12px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.8), 0 0 0 1px var(--border-card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Window Titlebar */
    .window-titlebar {
      height: 44px;
      background-color: var(--bg-window);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-card);
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-icon {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #1F6FEB, #238636);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }
    .app-title-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .window-controls {
      display: flex;
      gap: 8px;
    }
    .win-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #21262D;
    }

    /* Main Container */
    .main-container {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
    }

    /* Outer Main Tabs (音频处理 / 视频处理) */
    .outer-tabs-row {
      display: flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }
    .outer-tab-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .outer-tab-btn.active {
      background: var(--bg-window);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      border: 1px solid rgba(88, 166, 255, 0.3);
    }

    /* Inner Sub-Card Container */
    .inner-panel-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
    }

    /* Inner Sub Tabs (分割 / 合并 / 截取) */
    .inner-tabs-row {
      display: flex;
      background: var(--bg-window);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .inner-tab-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.12s ease;
    }
    .inner-tab-btn.active {
      background: var(--bg-subtle);
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* Form Body */
    .form-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
      padding-top: 4px;
      justify-content: space-between;
    }

    /* File Selector Card */
    .file-input-card {
      background: var(--bg-window);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .file-name-text {
      font-family: var(--font-mono);
      color: var(--text-primary);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 380px;
    }
    .file-size-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-blue);
      background: rgba(88, 166, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-select-file {
      height: 38px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn-select-file:hover {
      border-color: var(--accent-blue);
      background: #1C212B;
    }

    /* Parameters Grid */
    .params-cluster {
      background: var(--bg-window);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .param-field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .param-field-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .param-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .param-hint {
      font-size: 11px;
      color: var(--text-muted);
    }
    .dark-num-input {
      width: 110px;
      height: 34px;
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      color: var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: all 0.15s ease;
    }
    .dark-num-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 1px var(--accent-blue);
    }

    /* Output Folder Row */
    .outdir-row {
      background: var(--bg-window);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .outdir-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 380px;
    }
    .outdir-label {
      font-size: 11px;
      color: var(--text-muted);
    }
    .outdir-path {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-change-dir {
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
    }
    .btn-change-dir:hover { border-color: var(--accent-blue); }

    /* Action Deck & Progress */
    .action-bottom-deck {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-action-start {
      height: 46px;
      background: var(--accent-green);
      color: #FFF;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(35, 134, 54, 0.4);
      transition: all 0.15s ease;
    }
    .btn-action-start:hover {
      background: var(--accent-green-hover);
      box-shadow: 0 6px 20px rgba(35, 134, 54, 0.6);
      transform: translateY(-1px);
    }

    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-bar-track {
      height: 6px;
      background: var(--bg-window);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border-card);
    }
    .progress-bar-fill {
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, #1F6FEB, #238636);
    }
    .status-msg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--accent-blue);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <!-- Fixed 620x720 App Window -->
  <div class="app-window">
    <!-- Window Titlebar -->
    <div class="window-titlebar">
      <div class="title-left">
        <div class="app-icon">✂</div>
        <span class="app-title-text">MediaSegmenter · 音视频切片工具</span>
      </div>
      <div class="window-controls">
        <span class="win-btn"></span>
        <span class="win-btn"></span>
        <span class="win-btn"></span>
      </div>
    </div>

    <div class="main-container">
      <!-- 1. Outer Main Tabs (音频处理 / 视频处理) -->
      <div class="outer-tabs-row">
        <div class="outer-tab-btn active">
          <span>🎧 音频处理</span>
        </div>
        <div class="outer-tab-btn">
          <span>🎬 视频处理</span>
        </div>
      </div>

      <!-- 2. Inner Sub Panel -->
      <div class="inner-panel-card">
        <!-- Sub Tabs (分割 / 合并 / 截取) -->
        <div class="inner-tabs-row">
          <div class="inner-tab-btn active">音频分割</div>
          <div class="inner-tab-btn">音频合并</div>
          <div class="inner-tab-btn">音频截取</div>
        </div>

        <!-- 3. Form Content (1:1 原功能字段) -->
        <div class="form-content">
          <!-- File Selector -->
          <div class="file-input-card">
            <div class="file-status-row">
              <span class="file-name-text">podcast_interview_ep12.mp3</span>
              <span class="file-size-tag">58.4 MB · 42:18</span>
            </div>
            <button class="btn-select-file">
              <span>📁 选择媒体文件</span>
            </button>
          </div>

          <!-- Parameters Grid -->
          <div class="params-cluster">
            <div class="param-field-row">
              <div class="param-field-info">
                <span class="param-title">分割数量 (每段):</span>
                <span class="param-hint">目标均等分段数 (当前每段约 5分17秒)</span>
              </div>
              <input class="dark-num-input" value="8">
            </div>

            <div class="param-field-row">
              <div class="param-field-info">
                <span class="param-title">前置重叠时间 (秒):</span>
                <span class="param-hint">每段起始预留前置冗余，防止丢失首尾语音</span>
              </div>
              <input class="dark-num-input" value="3.0">
            </div>
          </div>

          <!-- Output Folder -->
          <div class="outdir-row">
            <div class="outdir-left">
              <span class="outdir-label">输出文件夹:</span>
              <span class="outdir-path">C:/code/media_segmenter/output/</span>
            </div>
            <button class="btn-change-dir">选择输出文件夹</button>
          </div>

          <!-- Action & Progress -->
          <div class="action-bottom-deck">
            <button class="btn-action-start">
              <span>⚡ 开始无损分割</span>
            </button>

            <div class="progress-box">
              <div class="progress-bar-track">
                <div class="progress-bar-fill"></div>
              </div>
              <div class="status-msg-row">
                <span>正在分割: 第 4/8 段 (podcast_ep12_part04.mp3)...</span>
                <span>50%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
