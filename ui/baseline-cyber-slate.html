<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>太空岩灰 · Cyber Slate Pro (严格保持原结构)</title>
  <style>
    :root {
      --bg-desktop: #0D0F12;
      --bg-window: #181B22;
      --bg-panel: #202530;
      --bg-subtle: #14171E;
      --border-card: #2B3242;
      --border-highlight: #00E5FF;
      --accent-cyan: #00F0FF;
      --accent-blue: #3B82F6;
      --accent-amber: #F59E0B;
      --accent-green: #10B981;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, monospace;
      --shadow-window: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-desktop);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 820px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Fixed 620x720 App Window */
    .app-window {
      width: 620px;
      height: 720px;
      background-color: var(--bg-window);
      border-radius: 12px;
      box-shadow: var(--shadow-window);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-card);
    }

    /* Titlebar */
    .window-titlebar {
      height: 42px;
      background-color: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-card);
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-icon {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #00F0FF, #3B82F6);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 11px;
      font-weight: 900;
    }
    .app-title-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .window-controls {
      display: flex;
      gap: 8px;
    }
    .win-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2D3342;
    }

    /* Main Container */
    .main-container {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
    }

    /* Outer Main Tabs */
    .outer-tabs-row {
      display: flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }
    .outer-tab-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mono);
    }
    .outer-tab-btn.active {
      background: var(--bg-panel);
      color: var(--accent-cyan);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    /* Inner Sub Panel */
    .inner-panel-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
    }

    /* Inner Sub Tabs */
    .inner-tabs-row {
      display: flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .inner-tab-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.12s ease;
      font-family: var(--font-mono);
    }
    .inner-tab-btn.active {
      background: var(--bg-window);
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Form Content */
    .form-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
      padding-top: 4px;
      justify-content: space-between;
    }

    /* File Input Card */
    .file-input-card {
      background: var(--bg-window);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .file-name-text {
      font-family: var(--font-mono);
      color: var(--text-primary);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 380px;
    }
    .file-size-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .btn-select-file {
      height: 38px;
      background: var(--bg-panel);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      font-family: var(--font-mono);
    }
    .btn-select-file:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Parameters Grid */
    .params-cluster {
      background: var(--bg-window);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .param-field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .param-field-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .param-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .param-hint {
      font-size: 11px;
      color: var(--text-muted);
    }
    .slate-num-input {
      width: 100px;
      height: 34px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .slate-num-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    /* Outdir Row */
    .outdir-row {
      background: var(--bg-window);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .outdir-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 380px;
    }
    .outdir-label {
      font-size: 11px;
      color: var(--text-muted);
    }
    .outdir-path {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-change-dir {
      background: var(--bg-panel);
      border: 1px solid var(--border-card);
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .btn-change-dir:hover { border-color: var(--accent-cyan); }

    /* Action Deck */
    .action-bottom-deck {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-action-start {
      height: 46px;
      background: linear-gradient(135deg, #00F0FF, #0072FF);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 240, 255, 0.3);
      transition: all 0.15s ease;
    }
    .btn-action-start:hover {
      box-shadow: 0 6px 24px rgba(0, 240, 255, 0.5);
      transform: translateY(-1px);
    }

    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-bar-track {
      height: 6px;
      background: var(--bg-subtle);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border-card);
    }
    .progress-bar-fill {
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, #00F0FF, #10B981);
    }
    .status-msg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="app-window">
    <div class="window-titlebar">
      <div class="title-left">
        <div class="app-icon">✂</div>
        <span class="app-title-text">MEDIA SEGMENTER PRO</span>
      </div>
      <div class="window-controls">
        <span class="win-btn"></span>
        <span class="win-btn"></span>
        <span class="win-btn"></span>
      </div>
    </div>

    <div class="main-container">
      <!-- 1. Outer Main Tabs -->
      <div class="outer-tabs-row">
        <div class="outer-tab-btn active">
          <span>🎧 AUDIO STUDIO</span>
        </div>
        <div class="outer-tab-btn">
          <span>🎬 VIDEO STUDIO</span>
        </div>
      </div>

      <!-- 2. Inner Sub Panel -->
      <div class="inner-panel-card">
        <div class="inner-tabs-row">
          <div class="inner-tab-btn active">音频分割</div>
          <div class="inner-tab-btn">音频合并</div>
          <div class="inner-tab-btn">音频截取</div>
        </div>

        <!-- 3. Form Content -->
        <div class="form-content">
          <div class="file-input-card">
            <div class="file-status-row">
              <span class="file-name-text">podcast_interview_ep12.mp3</span>
              <span class="file-size-tag">58.4 MB · 42:18</span>
            </div>
            <button class="btn-select-file">
              <span>📁 SELECT MEDIA FILE</span>
            </button>
          </div>

          <div class="params-cluster">
            <div class="param-field-row">
              <div class="param-field-info">
                <span class="param-title">分割数量 (每段):</span>
                <span class="param-hint">目标均等分段数 (当前每段约 5分17秒)</span>
              </div>
              <input class="slate-num-input" value="8">
            </div>

            <div class="param-field-row">
              <div class="param-field-info">
                <span class="param-title">前置重叠时间 (秒):</span>
                <span class="param-hint">每段起始预留前置冗余，防止丢失首尾语音</span>
              </div>
              <input class="slate-num-input" value="3.0">
            </div>
          </div>

          <div class="outdir-row">
            <div class="outdir-left">
              <span class="outdir-label">输出文件夹:</span>
              <span class="outdir-path">C:/code/media_segmenter/output/</span>
            </div>
            <button class="btn-change-dir">选择输出文件夹</button>
          </div>

          <div class="action-bottom-deck">
            <button class="btn-action-start">
              <span>⚡ START FAST SLICE</span>
            </button>

            <div class="progress-box">
              <div class="progress-bar-track">
                <div class="progress-bar-fill"></div>
              </div>
              <div class="status-msg-row">
                <span>正在分割: 第 4/8 段 (podcast_ep12_part04.mp3)...</span>
                <span>50%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
